<div style="
    width: 100%;
    height: 100%">
    <img 
        src="assets/images/auth-back.jpg"
    style="width: 100%; height: 100%; position: absolute; z-index: -1; object-fit: cover; object-position: center;">
    <mat-grid-list cols="1" rowHeight="600px">
        <mat-grid-tile>
            <mat-card class="mat-elevation-z13" style="width: 50%; height: 75%;">
                <mat-card-header>
                    <mat-card-title>NUTRILIFE</mat-card-title>
                </mat-card-header>
                <mat-card-content style="margin: 5% 10% 5% 10%">
                    <form [formGroup]="formLogin" (submit)="login()">

                        <mat-form-field appearance="standard">
                            <mat-label>Nombre de usuario</mat-label>
                            <input matInput formControlName="username">
                            <mat-error *ngIf="validarCampos('username')">Nombre de usuario inválido</mat-error>
                        </mat-form-field>
                        <br>
                        <mat-form-field appearance="standard">
                            <mat-label>Contraseña</mat-label>
                            <input matInput type="password" formControlName="password">
                            <mat-error *ngIf="validarCampos('password')">Constraseña no válida</mat-error>
                        </mat-form-field>
                        <br>
                        <br>
                        <br>
                        <button mat-raised-button class="btn-center" color="primary"> <mat-icon *ngIf="loading"><mat-spinner color="accent" diameter="20">
                        </mat-spinner></mat-icon>Iniciar Sesión</button>
                        
                    </form>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</div>
